name: Release Aether

on:
  push:
    branches:
      - synvoe
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images and, for tags, GitHub Release assets
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: release-aether-${{ github.ref_type == 'branch' && github.ref_name == 'synvoe' && 'synvoe' || github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.ref_name == 'synvoe' }}

env:
  REGISTRY: ghcr.io
  GHCR_IMAGE: nyadoo/aether

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.classify.outputs.publish }}
      github_release: ${{ steps.classify.outputs.github_release }}
      version_tag: ${{ steps.classify.outputs.version_tag }}
      source_ref: ${{ steps.classify.outputs.source_ref }}
      prerelease: ${{ steps.classify.outputs.prerelease }}
      make_latest: ${{ steps.classify.outputs.make_latest }}
      branch_release: ${{ steps.classify.outputs.branch_release }}
      tag_release: ${{ steps.classify.outputs.tag_release }}
      is_synvoe: ${{ steps.classify.outputs.is_synvoe }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify release
        id: classify
        env:
          AETHER_MANUAL_PUBLISH: ${{ inputs.publish || false }}
        run: bash .github/scripts/classify-release.sh

      - name: Verify release tag ancestry
        if: steps.classify.outputs.tag_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_branch="main"
          if [[ "${{ steps.classify.outputs.is_synvoe }}" == "true" ]]; then
            release_branch="synvoe"
          fi
          git fetch --no-tags origin "+refs/heads/${release_branch}:refs/remotes/origin/${release_branch}"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/${release_branch}"; then
            echo "${GITHUB_REF_NAME} must point to a commit reachable from origin/${release_branch}." >&2
            exit 1
          fi

  frontend:
    name: Build frontend
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-amd64
            target: x86_64-unknown-linux-musl
            platform: linux
            arch: amd64
            os: ubuntu-latest
            use_cross: true
          - name: linux-arm64
            target: aarch64-unknown-linux-musl
            platform: linux
            arch: arm64
            os: ubuntu-latest
            use_cross: true
          - name: macos-amd64
            target: x86_64-apple-darwin
            platform: macos
            arch: amd64
            os: macos-15-intel
            use_cross: false
          - name: macos-arm64
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            os: macos-15
            use_cross: false
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          workspaces: . -> target

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build
        env:
          AETHER_VERSION: ${{ needs.preflight.outputs.version_tag }}
          AETHER_BUILD_TYPE: release
          CARGO_TERM_COLOR: always
        shell: bash
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --locked -p aether-gateway --target ${{ matrix.target }}
          else
            cargo build --release --locked -p aether-gateway --target ${{ matrix.target }}
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: aether-gateway-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/aether-gateway
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Docker multi-arch
    needs: [preflight, frontend, build]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Prepare dist layout
        run: |
          mkdir -p dist
          cp artifacts/aether-gateway-linux-amd64/aether-gateway dist/aether-gateway-amd64
          cp artifacts/aether-gateway-linux-arm64/aether-gateway dist/aether-gateway-arm64
          chmod +x dist/aether-gateway-amd64 dist/aether-gateway-arm64
          cp -r artifacts/frontend-dist dist/frontend

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure optional Docker Hub publishing
        id: dockerhub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" && -n "${DOCKERHUB_IMAGE}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Docker Hub publishing is enabled."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Docker Hub publishing is not configured; continuing with GHCR only."
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.GHCR_IMAGE }}
            name=docker.io/${{ vars.DOCKERHUB_IMAGE || 'nyadoo/aether' }},enable=${{ steps.dockerhub.outputs.enabled == 'true' }}
          tags: |
            type=semver,pattern={{version}},enable=${{ needs.preflight.outputs.tag_release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.preflight.outputs.tag_release == 'true' && needs.preflight.outputs.make_latest == 'true' }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.make_latest == 'true' }}
            type=raw,value=beta,enable=${{ needs.preflight.outputs.tag_release == 'true' && contains(github.ref_name, '-beta.') }}
            type=raw,value=rc,enable=${{ needs.preflight.outputs.tag_release == 'true' && contains(github.ref_name, '-rc.') }}
            type=raw,value=synvoe,enable=${{ needs.preflight.outputs.branch_release == 'true' }}
            type=raw,value=${{ needs.preflight.outputs.version_tag }},enable=${{ needs.preflight.outputs.branch_release == 'true' }}
            type=sha,prefix=sha-
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  package:
    name: Release tarballs
    needs: [preflight, frontend, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Build release packages
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version_tag }}
          RELEASE_SOURCE_REF: ${{ needs.preflight.outputs.source_ref }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          SOURCE_REF="${RELEASE_SOURCE_REF}"

          mkdir -p package release-assets
          for platform in linux macos; do
            for arch in amd64 arm64; do
              bundle="aether-${VERSION}-${platform}-${arch}"
              root="package/${bundle}"
              mkdir -p \
                "${root}/bin" \
                "${root}/frontend"

              install -m 0755 "artifacts/aether-gateway-${platform}-${arch}/aether-gateway" "${root}/bin/aether-gateway"
              cp -R artifacts/frontend-dist/. "${root}/frontend/"
              sed \
                -e "s/^SOURCE_REF=\"\${AETHER_SOURCE_REF:-synvoe}\"/SOURCE_REF=\"\${AETHER_SOURCE_REF:-${SOURCE_REF}}\"/" \
                -e "s/^VERSION=\"\${AETHER_VERSION:-}\"/VERSION=\"\${AETHER_VERSION:-${VERSION}}\"/" \
                install.sh > "${root}/install.sh"
              chmod 0755 "${root}/install.sh"
              install -m 0755 update.sh "${root}/update.sh"
              install -m 0644 docker-compose.yml "${root}/docker-compose.yml"
              install -m 0644 docker-compose.single-node.yml "${root}/docker-compose.single-node.yml"
              install -m 0644 .env.example "${root}/.env.example"
              install -m 0755 generate_keys.sh "${root}/generate_keys.sh"
              install -m 0644 README.md "${root}/README.md"
              install -m 0644 LICENSE "${root}/LICENSE"

              tar -C package -czf "release-assets/${bundle}.tar.gz" "${bundle}"
            done
          done

          sed \
            -e "s/^SOURCE_REF=\"\${AETHER_SOURCE_REF:-synvoe}\"/SOURCE_REF=\"\${AETHER_SOURCE_REF:-${SOURCE_REF}}\"/" \
            -e "s/^VERSION=\"\${AETHER_VERSION:-}\"/VERSION=\"\${AETHER_VERSION:-${VERSION}}\"/" \
            install.sh > release-assets/install.sh
          chmod +x release-assets/install.sh
          (cd release-assets && sha256sum *.tar.gz > SHA256SUMS)

      - name: Upload release package artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: GitHub Release assets
    needs: [preflight, docker, package]
    if: needs.preflight.outputs.github_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release package artifact
        uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: release-assets

      - name: Delete stale draft releases for tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          draft_ids="$(gh api "repos/${REPOSITORY}/releases" --paginate --jq '.[] | select(.tag_name == env.RELEASE_TAG and .draft == true) | .id')"

          if [[ -z "${draft_ids}" ]]; then
            echo "No stale draft releases for ${RELEASE_TAG}"
            exit 0
          fi

          while IFS= read -r release_id; do
            [[ -z "${release_id}" ]] && continue
            echo "Deleting stale draft release ${release_id} for ${RELEASE_TAG}"
            gh api -X DELETE "repos/${REPOSITORY}/releases/${release_id}"
          done <<< "${draft_ids}"

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
            release-assets/install.sh
